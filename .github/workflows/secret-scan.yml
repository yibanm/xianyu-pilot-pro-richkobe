name: Secret Scan

# 密钥历史扫描，从 ci.yml 拆出独立触发：
# - push（所有分支）：增量扫描本次 push 的新提交并阻断新泄露。
#   桌面打包分支因此不再背上游 git 历史里既有的 19 处泄露（上游仓库自身扫描同为 19 处）。
# - schedule / 手动：全历史扫描（--log-opts=--all），保留对既有泄露的持续证据。
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-history-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-$GITLEAKS_VERSION"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" gitleaks
          "$install_dir/gitleaks" version | grep --fixed-strings "$GITLEAKS_VERSION"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Scan Git history for hardcoded secrets with redacted findings
        shell: bash
        run: |
          set -euo pipefail
          ZERO="0000000000000000000000000000000000000000"
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "$ZERO" ]; then
              # 新分支首推：before 为全零，改扫本次 push 的首个新提交起（含）到 HEAD
              FIRST="${{ github.event.commits[0].id }}"
              if [ -n "$FIRST" ] && [ "$FIRST" != "null" ]; then
                RANGE="${FIRST}^..HEAD"
              else
                RANGE="HEAD^!"
              fi
            else
              RANGE="${BEFORE}..HEAD"
            fi
            echo "增量扫描范围: $RANGE"
            gitleaks git \
              --redact=100 \
              --log-opts="$RANGE" \
              --report-format=sarif \
              --report-path=results.sarif \
              --exit-code=1 \
              --no-banner \
              --log-level=info \
              .
          else
            echo "全历史扫描（schedule / 手动触发）"
            gitleaks git \
              --redact=100 \
              --log-opts=--all \
              --report-format=sarif \
              --report-path=results.sarif \
              --exit-code=1 \
              --no-banner \
              --log-level=info \
              .
          fi
      - name: Upload redacted secret-scan evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-history-scan-${{ github.sha }}
          path: results.sarif
          if-no-files-found: error
          retention-days: 30
