<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>闲鱼助手 · 科比版</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #14161a; color: #e6e6e6;
    font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  .card { width: min(620px, 92vw); padding: 28px 30px; }
  h1 { font-size: 19px; font-weight: 600; margin: 0 0 4px; letter-spacing: .3px; }
  .sub { font-size: 12.5px; color: #8b929e; margin: 0 0 22px; }
  .spin {
    width: 15px; height: 15px; display: inline-block; vertical-align: -3px;
    margin-right: 8px; border: 2px solid #2f3540; border-top-color: #4c8dff;
    border-radius: 50%; animation: r .8s linear infinite;
  }
  @keyframes r { to { transform: rotate(360deg); } }
  #status { font-size: 13.5px; color: #cfd4dc; min-height: 20px; margin-bottom: 10px; }
  /* 进度条：宽度按已完成步骤数 / 预估总步骤数 */
  #barWrap {
    height: 6px; background: #23262d; border-radius: 3px;
    overflow: hidden; margin-bottom: 14px;
  }
  #bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #2f5fdd, #4c8dff);
    border-radius: 3px;
    transition: width .4s ease;
  }
  #bar.indet {
    width: 30%;
    animation: indet 1.4s ease-in-out infinite;
  }
  @keyframes indet {
    0%   { margin-left: -30%; }
    100% { margin-left: 100%; }
  }
  #log {
    max-height: 200px; overflow-y: auto; font-size: 12px; line-height: 1.75;
    color: #7d848f; border-top: 1px solid #23262d; padding-top: 12px;
    font-family: Consolas, "Courier New", monospace;
  }
  #log div { white-space: pre-wrap; word-break: break-all; }
  #err { display: none; margin-top: 16px; }
  #err .box {
    background: #2a1c1e; border: 1px solid #5a2f34; border-radius: 8px;
    padding: 14px 16px; font-size: 12.5px; line-height: 1.65; color: #f0c9cd;
    white-space: pre-wrap; word-break: break-all; max-height: 240px; overflow-y: auto;
    -webkit-user-select: text; user-select: text;
  }
  #err h2 { font-size: 14px; margin: 0 0 10px; color: #ff9aa4; font-weight: 600; }
  .btns { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    background: #23272f; color: #dfe3e9; border: 1px solid #343a45;
    border-radius: 6px; padding: 7px 14px; font-size: 12.5px; cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: #2b303a; border-color: #46505e; }
  button.primary { background: #2f5fdd; border-color: #2f5fdd; color: #fff; }
  button.primary:hover { background: #3a6cef; }
  .hint { margin-top: 10px; font-size: 11.5px; color: #6d7480; line-height: 1.6; }
</style>
</head>
<body>
<div class="card">
  <h1>闲鱼助手 · 科比版</h1>
  <p class="sub">正在启动本地服务，首次运行需要初始化数据库，请耐心等待</p>

  <div id="status"><span class="spin"></span><span id="statusText">正在准备…</span></div>
  <div id="barWrap"><div id="bar" class="indet"></div></div>
  <div id="log"></div>

  <div id="err">
    <h2>启动失败</h2>
    <div class="box" id="errText"></div>
    <div class="btns">
      <button class="primary" onclick="window.__openLogs && window.__openLogs()">打开日志目录</button>
      <button onclick="window.__quit && window.__quit()">退出程序</button>
    </div>
    <div class="hint">
      把上面的错误信息连同日志目录里的文件一起反馈，便于定位问题。<br>
      常见原因：安装路径含中文（数据库不支持）、端口被占用、杀毒软件拦截。
    </div>
  </div>
</div>

<script>
  // 轮询 Rust 侧的 boot_pull 命令拉取进度。
  // 不用 Rust 主动 eval 推送：页面脚本未就绪时推送会静默丢失。
  var seen = 0;
  var TOTAL_STEPS = 14; // 预估总步骤数，仅用于进度条比例，非精确值

  function appendLine(msg) {
    var log = document.getElementById('log');
    var line = document.createElement('div');
    line.textContent = msg;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
    document.getElementById('statusText').textContent = msg;
    // 进度条：按已收到的步骤数估算
    var pct = Math.min(96, Math.round((seen / TOTAL_STEPS) * 100));
    var bar = document.getElementById('bar');
    bar.classList.remove('indet');
    bar.style.width = pct + '%';
  }

  function showError(msg) {
    document.getElementById('status').style.display = 'none';
    document.getElementById('barWrap').style.display = 'none';
    document.getElementById('err').style.display = 'block';
    document.getElementById('errText').textContent = msg;
    document.title = '闲鱼助手 · 启动失败';
  }

  function poll() {
    if (!window.__TAURI__ || !window.__TAURI__.core) {
      setTimeout(poll, 300); // Tauri 注入尚未就绪，稍后重试
      return;
    }
    window.__TAURI__.core.invoke('boot_pull', { since: seen })
      .then(function (res) {
        var lines = res[0], done = res[1], err = res[2];
        for (var i = 0; i < lines.length; i++) {
          appendLine(lines[i]);
          seen++;
        }
        if (err) {
          showError(err);
          return; // 停止轮询
        }
        if (done && !err) {
          document.getElementById('bar').style.width = '100%';
          document.getElementById('statusText').textContent = '启动完成';
          return; // 主窗口即将打开，停止轮询
        }
        setTimeout(poll, 600);
      })
      .catch(function () {
        setTimeout(poll, 600); // 命令暂不可用（启动极早期），继续重试
      });
  }

  // 打开日志目录 / 退出程序
  window.__openLogs = function () {
    try { window.__TAURI__.core.invoke('open_logs_dir'); }
    catch (e) { alert('无法打开日志目录: ' + e); }
  };
  window.__quit = function () {
    try { window.__TAURI__.core.invoke('quit_app'); }
    catch (e) { alert('无法退出: ' + e); }
  };

  poll();
</script>
</body>
</html>
